name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bundle a standalone Python + backend deps so the app runs with no setup.
      # (macOS also gets MLX for the on-device brain; Windows/Linux use API or a
      # local OpenAI-compatible server.)
      - name: Bundle backend runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "macOS" ]; then
            python -m pip install ".[voice,local]"
          else
            python -m pip install ".[voice]"
          fi
          python - <<'PY'
          import shutil, sysconfig, pathlib
          prefix = pathlib.Path(sysconfig.get_paths()["stdlib"]).parent
          dst = pathlib.Path("apps/desktop/python")
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(prefix, dst, symlinks=False)
          print("bundled python:", prefix, "->", dst)
          PY
          du -sh apps/desktop/python || true

      # Also bundle `uv` as a fallback runtime.
      - name: Stage bundled uv
        shell: bash
        run: |
          mkdir -p apps/desktop/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$(command -v uv)" apps/desktop/bin/uv.exe
          else
            cp "$(command -v uv)" apps/desktop/bin/uv
          fi

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm install

      - name: Build installers
        working-directory: apps/desktop
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-live-1-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
          fail_on_unmatched_files: false
